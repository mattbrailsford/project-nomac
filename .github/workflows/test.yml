name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, to catch upstream NOMAD releases that break the Mac port.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s bash nomac lib/*.sh tests/*.sh
      - name: compose file is valid
        run: |
          mkdir -p /tmp/h
          printf 'NOMAD_VERSION=1.0.0\nNOMAD_PORT=8080\nDOZZLE_PORT=9999\nSTORAGE_PATH=/tmp/s\nNOMAC_HOME=/tmp/h\nAPP_KEY=x\nDB_PASSWORD=x\nMYSQL_ROOT_PASSWORD=x\nNOMAD_URL=http://localhost:8080\n' > /tmp/h/.env
          docker compose --env-file /tmp/h/.env -f compose/compose.yaml --profile dozzle config --quiet

  macos-host:
    # Apple Silicon runner, stock /bin/bash 3.2. No Docker on these runners,
    # so this covers Homebrew, launchd, Ollama and the host-side jobs.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mac host test
        run: /bin/bash tests/macos-host.sh
      - name: Logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/nomac-mac/home/logs/*.log "$RUNNER_TEMP"/nomac-mac/home/update-shared/update-log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; }
          done
          ls -l ~/Library/LaunchAgents/ || true

  e2e-arm64:
    # Native arm64 Linux with Docker: the same image and containers the Mac
    # runs inside OrbStack's Linux VM.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Native Ollama on the host (stands in for Ollama on the Mac)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nEnvironment="OLLAMA_HOST=0.0.0.0:11434"\nEnvironment="OLLAMA_MAX_LOADED_MODELS=1"\nEnvironment="OLLAMA_NUM_PARALLEL=1"\nEnvironment="OLLAMA_KEEP_ALIVE=10m"\n' \
            | sudo tee /etc/systemd/system/ollama.service.d/nomac.conf
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 30); do curl -fsS localhost:11434/api/version && break; sleep 2; done
      - name: End-to-end test
        run: bash tests/e2e-linux.sh
      - name: Logs
        if: always()
        run: |
          W="$RUNNER_TEMP/nomac-e2e"
          for f in "$W"/home/update-shared/update-log "$W"/handler.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 300 "$f"; echo "::endgroup::"; }
          done
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::docker logs $c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done
          df -h /
